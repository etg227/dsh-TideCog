# 复制一份改名成 config.toml 再改。密钥不写在这里，见 README 的「设置密钥」。

data_dir = "data"
context_budget = 64000  # 上下文上限（token，按上一次调用的实际输入算）；超了把最旧的三分之一圈整块移进存档

[onebot]
api_url = "http://127.0.0.1:3020"   # 测试号 SnowLuma 的 HTTP 服务器
listen_host = "127.0.0.1"
listen_port = 5311                  # SnowLuma 的 HTTP 上报发到 http://127.0.0.1:5311/

[llm]
base_url = "https://api.deepseek.com"
model = "deepseek-chat"
max_steps = 8           # 一圈里最多连着调几次模型
# 每百万 token 多少元（闲时价）。默认是 DeepSeek-V4.1-Flash 的价，换模型记得改
price_hit = 0.02
price_miss = 1.0
price_out = 4.0
peak_multiplier = 2.0   # 工作日 9–12 点、14–18 点按这个倍数算

[gate]
owner_qq = ""           # 你的 QQ 号。私聊她发「暂停」「继续」只认这个号，夜里也只有这个号叫得醒她
owner_name = "主人"      # 她怎么称呼你，会写进提示词
allow_groups = []       # 允许她说话的群，比如 ["123456789"]
allow_users = []        # 允许私聊的 QQ 号
per_conv_per_minute = 4
global_per_minute = 10
max_text_len = 500

[console]
host = "127.0.0.1"
port = 5310

[inbox]
group_batch_seconds = 30   # 群里没 @ 她的消息，攒多少秒再叫醒她
group_min_interval = 180   # 同一个群，普通消息最快多少秒叫醒她一次

[rhythm]
heartbeat_default = 30     # 她没说下次几分钟醒，就按这个（分钟）
heartbeat_min = 5          # 她 rest 时能选的最短、最长间隔（分钟）
heartbeat_max = 120
sleep_start = "00:30"      # 北京时间。睡着时只有你私聊能叫醒她，其他消息攒到早上
wake_time = "08:30"
